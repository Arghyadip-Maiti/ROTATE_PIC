<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futuristic Buttons</title>
    <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }

              body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
              }

              .container {
                display: flex;
                flex-direction: column;
                gap: 50px;
                max-width: 500px;
                width: 100%;
              }

              /* Button 1: Holographic Glitch */

              .BUTTON1 {
                position: relative;
                padding: 20px 60px;
                background: transparent;
                border: 2px solid #00ffff;
                color: #00ffff;
                font-size: 18px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 3px;
                cursor: pointer;
                overflow: hidden;
                transition: all 0.3s ease;
              }

              .BUTTON1::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                  90deg,
                  transparent,
                  rgba(0, 255, 255, 0.4),
                  transparent
                );
                transition: left 0.5s ease;
              }

              .BUTTON1::after {
                content: attr(data-text);
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ff00ff;
                opacity: 0;
                transform: translate(2px, 2px);
                transition: opacity 0.1s ease;
              }

              .BUTTON1:hover::before {
                left: 100%;
              }

              .BUTTON1:hover::after {
                animation: glitch 0.3s ease infinite;
              }

              .BUTTON1:hover {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.6),
                  inset 0 0 30px rgba(0, 255, 255, 0.2);
                text-shadow: 0 0 10px #00ffff;
              }

              @keyframes glitch {
                0%,
                100% {
                  opacity: 0;
                  transform: translate(0, 0);
                }
                25% {
                  opacity: 0.7;
                  transform: translate(-2px, 2px);
                }
                50% {
                  opacity: 0.7;
                  transform: translate(2px, -2px);
                }
                75% {
                  opacity: 0.7;
                  transform: translate(-2px, -2px);
                }
              }

              /* Button 2: Neon Pulse */
                              .BUTTON2 {
                                position: relative;
                                padding: 20px 60px;
                                background: rgba(255, 0, 255, 0.1);
                                border: 3px solid #ff00ff;
                                color: #ff00ff;
                                font-size: 18px;
                                font-weight: bold;
                                text-transform: uppercase;
                                letter-spacing: 3px;
                                cursor: pointer;
                                border-radius: 50px;
                                transition: all 0.3s ease;
                                animation: neonBorder 2s ease-in-out infinite;
                              }

                              @keyframes neonBorder {
                                0%,
                                100% {
                                  border-color: #ff00ff;
                                  box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff,
                                    inset 0 0 10px rgba(255, 0, 255, 0.2);
                                }
                                50% {
                                  border-color: #00ffff;
                                  box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff,
                                    inset 0 0 20px rgba(0, 255, 255, 0.2);
                                  color: #00ffff;
                                }
                              }

                              .BUTTON2:hover {
                                transform: scale(1.05);
                                background: rgba(255, 0, 255, 0.3);
                                animation: neonBorder 0.5s ease-in-out infinite;
                              }

                              /* Button 3: Particle Explode */
                              .BUTTON3 {
                                position: relative;
                                padding: 20px 60px;
                                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                                border: none;
                                color: white;
                                font-size: 18px;
                                font-weight: bold;
                                text-transform: uppercase;
                                letter-spacing: 3px;
                                cursor: pointer;
                                border-radius: 10px;
                                overflow: hidden;
                                transition: all 0.3s ease;
                              }

                              .BUTTON3::before {
                                content: "";
                                position: absolute;
                                width: 100%;
                                height: 100%;
                                top: 0;
                                left: 0;
                                background: radial-gradient(
                                  circle,
                                  transparent 20%,
                                  rgba(255, 255, 255, 0.3) 20%,
                                  rgba(255, 255, 255, 0.3) 40%,
                                  transparent 40%
                                );
                                background-size: 10px 10px;
                                opacity: 0;
                                transition: opacity 0.5s ease;
                              }

                              .BUTTON3:hover::before {
                                opacity: 1;
                                animation: particle-burst 0.6s ease-out;
                              }

                              .BUTTON3:hover {
                                box-shadow: 0 10px 40px rgba(102, 126, 234, 0.6);
                                transform: translateY(-3px);
                              }

                              @keyframes particle-burst {
                                0% {
                                  transform: scale(1);
                                  opacity: 1;
                                }
                                100% {
                                  transform: scale(2.5);
                                  opacity: 0;
                                }
                              }

                              /* Button 4: Quantum Shift */
                              .BUTTON4 {
                                position: relative;
                                padding: 20px 60px;
                                background: transparent;
                                border: none;
                                color: #00ff88;
                                font-size: 18px;
                                font-weight: bold;
                                text-transform: uppercase;
                                letter-spacing: 3px;
                                cursor: pointer;
                                overflow: hidden;
                              }

                              .BUTTON4::before,
                              .BUTTON4::after {
                                content: "";
                                position: absolute;
                                width: 100%;
                                height: 100%;
                                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                              }

                              .BUTTON4::before {
                                top: 0;
                                left: -100%;
                                background: linear-gradient(90deg, #00ff88, #00ffff);
                                z-index: -1;
                              }

                              .BUTTON4::after {
                                top: 0;
                                left: 0;
                                background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3));
                                z-index: -2;
                                transform: skewX(-20deg);
                              }

                              .BUTTON4:hover::before {
                                left: 0;
                              }

                              .BUTTON4:hover::after {
                                animation: quantum-wave 0.8s ease infinite;
                              }

                              .BUTTON4:hover {
                                color: #0a0e27;
                                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
                              }

                              @keyframes quantum-wave {
                                0% {
                                  transform: skewX(-20deg) translateX(-150%);
                                }
                                100% {
                                  transform: skewX(-20deg) translateX(150%);
                                }
                              }

                              /* Button 5: Cyber Circuit */
                              .BUTTON5 {
                                position: relative;
                                padding: 20px 60px;
                                background: #0a0e27;
                                border: 2px solid #ff0080;
                                color: #ff0080;
                                font-size: 18px;
                                font-weight: bold;
                                text-transform: uppercase;
                                letter-spacing: 3px;
                                cursor: pointer;
                                clip-path: polygon(
                                  10px 0,
                                  100% 0,
                                  100% calc(100% - 10px),
                                  calc(100% - 10px) 100%,
                                  0 100%,
                                  0 10px
                                );
                                transition: all 0.3s ease;
                              }

                              .BUTTON5::before {
                                content: "";
                                position: absolute;
                                top: -2px;
                                left: -2px;
                                right: -2px;
                                bottom: -2px;
                                background: linear-gradient(45deg, #ff0080, #00ffff, #ff0080);
                                background-size: 400% 400%;
                                z-index: -1;
                                clip-path: polygon(
                                  10px 0,
                                  100% 0,
                                  100% calc(100% - 10px),
                                  calc(100% - 10px) 100%,
                                  0 100%,
                                  0 10px
                                );
                                opacity: 0;
                                transition: opacity 0.3s ease;
                                animation: gradient-rotate 3s ease infinite;
                              }

                              .BUTTON5::after {
                                content: "";
                                position: absolute;
                                top: 0;
                                left: 0;
                                width: 100%;
                                height: 100%;
                                background: repeating-linear-gradient(
                                  0deg,
                                  rgba(255, 0, 128, 0.1) 0px,
                                  rgba(255, 0, 128, 0.1) 1px,
                                  transparent 1px,
                                  transparent 3px
                                );
                                opacity: 0;
                                transition: opacity 0.3s ease;
                              }

                              .BUTTON5:hover::before {
                                opacity: 1;
                              }

                              .BUTTON5:hover::after {
                                opacity: 1;
                                animation: scan 1s linear infinite;
                              }

                              .BUTTON5:hover {
                                color: #00ffff;
                                box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
                                transform: scale(1.02);
                              }

                              @keyframes gradient-rotate {
                                0%,
                                100% {
                                  background-position: 0% 50%;
                                }
                                50% {
                                  background-position: 100% 50%;
                                }
                              }

                              @keyframes scan {
                                0% {
                                  transform: translateY(-100%);
                                }
                                100% {
                                  transform: translateY(100%);
                                }
                              }

                              /* Button 6: Cyber Border */

                              .BUTTON6 {
                                padding: 14px 40px;
                                font-size: 1.1rem;
                                text-transform: uppercase;
                                border: none;
                                cursor: pointer;
                                transition: 0.3s;
                                letter-spacing: 1.5px;
                                color: #fff;
                                background: transparent;
                                border: 2px solid #00ffff33;
                                border-radius: 6px;
                                position: relative;
                                overflow: hidden;
                              }
                              .BUTTON6::before {
                                content: "";
                                position: absolute;
                                top: 0;
                                left: -100%;
                                width: 100%;
                                height: 100%;
                                border-top: 2px solid #0ff;
                                border-left: 2px solid #0ff;
                                transition: 0.5s;
                              }
                              .BUTTON6::after {
                                content: "";
                                position: absolute;
                                bottom: 0;
                                right: -100%;

                                height: 100%;
                                border-bottom: 2px solid #0ff;
                                border-right: 2px solid #0ff;
                                transition: 0.5s;
                              }
                              .BUTTON6:hover::before {
                                left: 0;
                              }
                              .BUTTON6:hover::after {
                                right: 0;
                              }

                              /* Button 7: Neon Ripple */

                              .BUTTON7 {
                                padding: 14px 40px;
                                font-size: 1.1rem;
                                text-transform: uppercase;
                                border: none;
                                cursor: pointer;
                                transition: 0.3s;
                                letter-spacing: 1.5px;
                                position: relative;
                                color: #fff;
                                background: #111;
                                border: none;
                                border-radius: 50px;
                                overflow: hidden;
                              }
                              .BUTTON7::after {
                                content: "";
                                position: absolute;
                                top: 50%;
                                left: 50%;
                                width: 0;
                                height: 0;
                                background: rgba(0, 255, 255, 0.3);
                                border-radius: 50%;
                                transform: translate(-50%, -50%);
                                transition: width 0.4s ease, height 0.4s ease;
                              }
                              .BUTTON7:hover::after {
                                width: 300px;
                                height: 300px;
                              }
                              .BUTTON7:hover {
                                box-shadow: 0 0 25px #0ff;
                              }

                              /* Button 8: Neon Pulse */

                              .BUTTON8 {
                                font-family: "Orbitron", "Segoe UI", Arial, sans-serif;
                                font-size: 1.2rem;
                                letter-spacing: 2px;
                                border: none;
                                cursor: pointer;
                                padding: 1.1em 3em;
                                transition: all 0.3s;
                                text-transform: uppercase;
                                margin: 0 auto;
                                display: block;
                                outline: none;
                                color: #0fffc1;
                                background: #232526;
                                box-shadow: 0 0 12px #0fffc1, 0 0 32px #0fffc1 inset;
                                border-radius: 12px;
                                border: 2px solid #0fffc1;
                                text-shadow: 0 0 5px #0fffc1, 0 0 15px #0fffc1;
                              }
                              .BUTTON8:hover {
                                background: #0fffc144;
                                box-shadow: 0 0 38px #0fffc1, 0 0 22px #ec38bc inset;
                                color: #ec38bc;
                                border: 2px solid #ec38bc;
                              }

                              /* Button 9: Glassmorphism */

                              .BUTTON9 {
                                font-family: "Orbitron", "Segoe UI", Arial, sans-serif;
                                font-size: 1.2rem;
                                letter-spacing: 2px;
                                border: none;
                                cursor: pointer;
                                padding: 1.1em 3em;
                                transition: all 0.3s;
                                text-transform: uppercase;
                                margin: 0 auto;
                                display: block;
                                outline: none;
                                background: rgba(200, 200, 255, 0.07);

                                border-radius: 24px;
                                border: 1.5px solid #dedbf766;

                                backdrop-filter: blur(5px) saturate(180%);

                                overflow: hidden;
                                z-index: 1;
                              }
                              .BUTTON9::after {
                                content: "";
                                position: absolute;
                                left: -100%;
                                top: 0;
                                width: 200%;
                                height: 100%;
                                background: linear-gradient(
                                  90deg,
                                  rgba(240, 255, 255, 0.12),
                                  rgba(200, 200, 255, 0.24),
                                  rgba(240, 255, 255, 0.12)
                                );
                                z-index: 0;
                                transition: left 0.45s;
                              }
                              .BUTTON9:hover::after {
                                left: 0;
                              }
                              .BUTTON9 span {
                                position: relative;
                                z-index: 3;
                              }

                              /* Button 10: Animated Border */

                              .BUTTON10 {
                                font-family: "Orbitron", "Segoe UI", Arial, sans-serif;
                                font-size: 1.2rem;
                                letter-spacing: 2px;
                                border: none;
                                cursor: pointer;
                                padding: 1.1em 3em;
                                transition: all 0.3s;
                                text-transform: uppercase;
                                margin: 0 auto;
                                display: block;
                                outline: none;
                                color: #fff;
                                background: none;
                                border: 0;
                                position: relative;
                                border-radius: 14px;
                                box-shadow: none;
                              }
                              .BUTTON10::before,
                              .BUTTON10::after {
                                content: "";
                                position: absolute;
                                left: -6px;
                                top: -6px;
                                width: calc(100% + 12px);
                                height: calc(100% + 12px);
                                border-radius: 14px;
                                border: 2.5px solid transparent;
                                background: linear-gradient(75deg, #0fffc1, #ec38bc, #7303c0, #0abcf9);
                                background-size: 300% 300%;
                                animation: borderMove 2.4s linear infinite;
                                opacity: 0.82;
                                z-index: 0;
                              }
                              .BUTTON10::after {
                                filter: blur(8px);
                                z-index: 0;
                              }
                              @keyframes borderMove {
                                0% {
                                  background-position: 0% 50%;
                                }
                                50% {
                                  background-position: 100% 50%;
                                }
                                100% {
                                  background-position: 0% 50%;
                                }
                              }
                              .BUTTON10 span {
                                position: relative;
                                z-index: 2;
                              }

                              /* Button 11: Liquid Morph */

                              .BUTTON11 {
                                font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
                                font-size: 1.2rem;
                                letter-spacing: 2px;
                                border: none;
                                cursor: pointer;
                                padding: 1.1em 3em;
                                transition: all 0.3s;
                                text-transform: uppercase;

                                display: block;

                                background: linear-gradient(120deg, #1f4037 40%, #0fffc1 120%);
                                border-radius: 25px 60px 32px 44px / 40px 39px 66px 25px;
                                border: none;
                                box-shadow: 0 0 20px #0fffc144;
                                position: relative;
                                overflow: hidden;
                                transition: border-radius 0.7s cubic-bezier(0.53, 1.53, 0.63, 0.95),
                                background: 0.45s;
                              }
                              .BUTTON11:hover {
                                border-radius: 44px 32px 52px 66px / 55px 25px 44px 39px;
                                background: linear-gradient(120deg, #ec38bc 22%, #0fffc1 90%);
                              }

                              /* Button 12: Holographic */

                              .BUTTON12 {
                                font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;

                                border: none;

                              }
                              .BUTTON12::after {

                              @keyframes holo-shimmer {
                                0% {
                                  left: -100%;
                                }
                                100% {
                                  left: 0%;
                                }
                              }
                              .BUTTON12 span {
                                position: relative;
                                z-index: 2;
                              }

                              .BUTTON13 {
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    padding: 1.5rem 3.5rem;
                                    text-transform: uppercase;

                                    border-radius: 0.5rem;
                                    cursor: pointer;

                                    transition: all 0.3s ease;

                                    background-size: 300% 300%;
                                    animation: plasma-shift 8s ease infinite;
                                    border: none;
                                }
                                @keyframes plasma-shift {
                                    0% { background-position: 0% 50%; }
                                    50% { background-position: 100% 50%; }
                                    100% { background-position: 0% 50%; }
                                }


                              /* Button 14: Holo Grid */

                              .BUTTON14 {
                                    display: flex;
                                    align-items: center;
                                    padding: 1.5rem 3.5rem;
                                    justify-content: center;
                                    text-transform: uppercase;
                                    font-weight: 700;
                                    border-radius: 0.5rem;
                                    cursor: pointer;

                                    text-align: center;
                                    font-size: 1.2rem;
                                    height: 60px; /* Uniform height for showcase */
                                    transition: all 0.3s ease;
                                    background-color: #1a202c;
                                    background-image: repeating-linear-gradient(

                              /* Button 15: Encapsulated Data */

                              .BUTTON15 {
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    padding: 1.5rem 3.5rem;
                                    text-transform: uppercase;

                              /* Button 16: Glitch Activate */

                              .BUTTON16 {
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    padding: 1.5rem 3.5rem;

                                }
                                @keyframes glitch-pulse {
                                    0% {
                                        transform: translate(2px, 2px);

                                        background-color: #f6ad55; /* Orange flash */
                                    }
                                    50% {
                                        transform: translate(-2px, -2px);
                                        box-shadow: 0 0 10px #00ffff;
                                        background-color: #48bb78; /* Green flash */
                                    }
                                    100% {
                                        transform: translate(0, 0);
                                        box-shadow: 0 0 5px #2b6cb0;
                                        background-color: #2b6cb0;
                                    }
                                }


                              /* Button 17: Biometric Confirmation */

                              .BUTTON17 {
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    padding: 1.5rem 3.5rem;
                                    text-transform: uppercase;
                                    font-weight: 700;

                                    text-align: center;

                                .BUTTON17::after {
                                    content: '';
                                    position: absolute;
                                    top: 0;
                                    left: -100%;
                                    width: 150%;
                                    height: 100%;
                                    background: linear-gradient(
