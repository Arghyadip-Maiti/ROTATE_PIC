<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Cartoon Login Form</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    height: 100vh;
    background: linear-gradient(135deg,#a18cd1, #fbc2eb); 
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .login-container {
    position: relative;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 60px 40px;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    width: 350px;
    text-align: center;
  }

  .cartoon {
    position: absolute;
    top: -130px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
  }

  /* Cartoon face */
  .face {
    position: relative;
    width: 140px;
    height: 140px;
    background: #ffe082;
    border-radius: 50%;
    border: 5px solid #ffca28;
    box-shadow: 0 5px 0 #fbc02d inset;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Eyes */
  .eye {
    position: absolute;
    width: 20px;
    height: 30px;
    background: #000;
    border-radius: 50%;
    top: 45px;
    animation: blink 4s infinite;
  }
  .eye.left { left: 40px; }
  .eye.right { right: 40px; }

  @keyframes blink {
    0%, 90%, 100% { height: 30px; }
    95% { height: 5px; }
  }

  /* Smile */
  .smile {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 25px;
    border-bottom: 5px solid #000;
    border-radius: 0 0 50px 50px;
  }

  /* Form Styling */
  h2 {
    margin-top: 70px;
    color: #fff;
    font-size: 1.8rem;
    letter-spacing: 1px;
  }

  .input-box {
    position: relative;
    margin-top: 25px;
  }

  .input-box input {
    width: 100%;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    outline: none;
    border-radius: 30px;
    color: #fff;
    font-size: 1rem;
    transition: 0.3s;
  }

  .input-box input::placeholder {
    color: rgba(255, 255, 255, 0.7);
  }

  .input-box input:focus {
    background: rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
  }

  .btn {
    margin-top: 25px;
    background: linear-gradient(90deg, #ff8a65, #ff5252);
    border: none;
    color: white;
    font-weight: 600;
    padding: 12px 40px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    background: linear-gradient(90deg, #ff1744, #ff9100);
    box-shadow: 0 0 20px rgba(255, 130, 80, 0.6);
  }

  .forgot {
    display: block;
    margin-top: 15px;
    color: #fff;
    font-size: 0.9rem;
    text-decoration: none;
    transition: 0.3s;
  }

  .forgot:hover {
    text-decoration: underline;
  }

  footer {
    position: absolute;
    bottom: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="cartoon">
    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="smile"></div>
    </div>
  </div>

  <h2>Welcome Back!</h2>
  <form>
    <div class="input-box">
      <input type="text" placeholder="Username" required>
    </div>
    <div class="input-box">
      <input type="password" placeholder="Password" required>
    </div>
    <button class="btn">Login</button>
    <a href="#" class="forgot">Forgot Password?</a>
  </form>
</div>

<footer>© 2025 Cartoon Login — by Arghyadip Maiti</footer>

</body>
</html>
